<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- D · Drabinka: a progression ladder whose rungs brighten towards the top.
       One outline (rails, top bar and rungs) with even-odd holes, so no shapes
       overlap and there is no seam; the fade is a vertical gradient. -->
  <defs>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="866">
      <stop offset="0" stop-color="#D1FF00" stop-opacity="1"/>
      <stop offset="1" stop-color="#D1FF00" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <path fill="url(#fade)" fill-rule="evenodd" d="M288 830V230A36 36 0 0 1 324 194H700A36 36 0 0 1 736 230V830A36 36 0 0 1 664 830V716H360V830A36 36 0 0 1 288 830Z M360 266H664V352H360Z M360 416H664V502H360Z M360 566H664V652H360Z"/>
</svg>
